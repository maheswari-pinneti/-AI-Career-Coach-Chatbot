version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/Dockerfile.backend
    container_name: ai_career_coach_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_APP=run.py
      - SECRET_KEY=docker-compose-production-secret-key-32chars
      - JWT_SECRET_KEY=docker-compose-production-jwt-key-32chars
      - DATABASE_URL=sqlite:////app/instance/ai_career_coach.db
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://localhost
      - AI_PROVIDER=mock
    volumes:
      - backend_data:/app/instance
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/Dockerfile.frontend
    container_name: ai_career_coach_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  backend_data:
  backend_uploads:
